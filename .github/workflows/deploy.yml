name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::897722709473:role/github-actions-deployment-role
          aws-region: us-east-1

      - name: Test AWS authentication
        run: aws sts get-caller-identity

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./form-site
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/form-site:latest

      - name: Deploy container to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-054dc321b27633562 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/form-site:latest",
              "docker stop form-site || true",
              "docker rm form-site || true",
              "docker run -d --name form-site -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/form-site:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          sleep 5

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-054dc321b27633562 \
            --query "[Status,StandardOutputContent,StandardErrorContent]" \
            --output text